<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Micro SNA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="/src/styles/colors.css">
 
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: white;
      }
 

 .sna-popover-form-container {
 background-color:  oklch(1 0 0);
  
 
  border-radius: var(--radius);
}
.sna-popover-title{
  color:#0759a3;
}
.sna-btn-action{
  background-color:#0759a3;
color: oklch(1 0 0) ;
}
#micro-sna-wrapper {
  all: initial;
  display: block;
}

#micro-sna-wrapper * {
  box-sizing: border-box;
  background-color: var(--color-background);
}
      #container {
        width: 100%;
        height: 100vh;
  background-color: var(--color-background);

      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <script>
      (async function () {
         window.addEventListener("message", (event) => {
  const data = event.data || {};

  if (!window.MicroSna) return;

  if (data.type === "SET_THEME") {
    console.log("theme FROM PARENT:", data.theme);

    window.MicroSna.setTheme(data.theme === "dark" ? "dark" : "light");
  }

  if (data.type === "APPLY_FILTER") {
    console.log("FILTER FROM PARENT:", data);
    window.MicroSna.submitFilter(data.filter);
  }
});

        const microSnaUrl = "https://sna.optimasi.ai";

        const res = await fetch(
          `${microSnaUrl}/manifest.json?t=${Math.floor(Date.now() / 21600000)}`
        );
        const manifest = await res.json();

        window.SNA_MODE = "production";

        const style = document.createElement("link");
        style.rel = "stylesheet";
        style.href = `${microSnaUrl}/${manifest["style.css"].file}`;
        document.head.appendChild(style);

        const script = document.createElement("script");
        script.src = `${microSnaUrl}/${manifest["src/micro-sna.ts"].file}`;
        document.body.appendChild(script);

        script.onload = function () {
          window.MicroSna.mount("container", {
            theme: "light",
            showMenu: {
              fullscreen: true,
              themeSwitcher: false,
              filter: false,
              savedData: false,
            },
            keepDragPosition: false,
            showGraphInfo: true,
            pointerInteraction: true,
          });
          // notify parent that SNA iframe is ready to receive messages
        

          // Also expose a quick ready flag on window for same-origin checks
        
        };
      })();
    </script>
  </body>
</html>
