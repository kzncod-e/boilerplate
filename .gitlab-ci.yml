stages:
  - validate
  - build
  - deploy

default:
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

before_script:
  - corepack enable
  - pnpm install --frozen-lockfile

# =========================
# VALIDATION (MR ONLY)
# =========================
lint:
  stage: validate
  script: pnpm lint
  rules:
    - if: $CI_MERGE_REQUEST_ID

typecheck:
  stage: validate
  script: pnpm typecheck
  rules:
    - if: $CI_MERGE_REQUEST_ID

test:
  stage: validate
  script: pnpm test
  rules:
    - if: $CI_MERGE_REQUEST_ID

# =========================
# BUILD
# =========================
build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - .next
      - public
      - package.json
      - pnpm-lock.yaml
      - ecosystem.config.js
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# =========================
# SSH BASE
# =========================
.deploy_ssh: &deploy_ssh
  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
    - ssh-keyscan -H $INTERNAL_HOST >> ~/.ssh/known_hosts

# =========================
# DEPLOY + AUTO ROLLBACK
# =========================
deploy:
  stage: deploy
  image: node:20
  <<: *deploy_ssh
  script:
    - |
      RELEASE=$(date +%Y%m%d-%H%M%S)

      ssh $SERVER_USER@$SERVER_HOST << EOF
        set -e
        ssh $INTERNAL_USER@$INTERNAL_HOST << 'INNER'
          set -e
          cd $APP_DIR

          mkdir -p releases/$RELEASE
          rsync -az --delete \
            --exclude=node_modules \
            $CI_PROJECT_DIR/.next \
            $CI_PROJECT_DIR/public \
            $CI_PROJECT_DIR/package.json \
            $CI_PROJECT_DIR/pnpm-lock.yaml \
            $CI_PROJECT_DIR/ecosystem.config.js \
            releases/$RELEASE/

          cd releases/$RELEASE
          pnpm install --prod --frozen-lockfile

          PREV_RELEASE=\$(readlink current || true)

          ln -sfn releases/$RELEASE current

          if ! pm2 reload ecosystem.config.js; then
            echo "❌ PM2 reload failed — rolling back"
            [ -n "\$PREV_RELEASE" ] && ln -sfn "\$PREV_RELEASE" current
            pm2 reload ecosystem.config.js
            exit 1
          fi

          pm2 save
          echo "✅ Deploy success: $RELEASE"
        INNER
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
